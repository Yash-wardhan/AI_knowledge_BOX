services:
  db:
    image: pgvector/pgvector:pg16
    container_name: knowledge-inbox-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: knowledge_inbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_inbox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: